# =============================================================================
# ProphitBet – SonarQube Project Configuration
# Covers: Python backend + desktop src/, Next.js TypeScript frontend
# =============================================================================

sonar.projectKey=prophitbet
sonar.projectName=ProphitBet Soccer Predictor
sonar.projectVersion=1.0

# ── Sources ────────────────────────────────────────────────────────────────────
# All Python + TypeScript code in the repo
sonar.sources=src,prophitbet-saas/backend/app,prophitbet-saas/backend/scripts,prophitbet-saas/frontend/app,prophitbet-saas/frontend/components,prophitbet-saas/frontend/hooks,prophitbet-saas/frontend/lib
sonar.tests=prophitbet-saas/backend/tests,prophitbet-saas/frontend/tests


# ── Exclusions ─────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.venv/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/migrations/**,\
  **/alembic/versions/**,\
  storage/**,\
  screenshots/**,\
  **/pytest-cache-files-*/**,\
  **/*.log

sonar.test.exclusions=\
  **/node_modules/**,\
  **/.next/**

# ── Python ────────────────────────────────────────────────────────────────────
sonar.python.version=3.11

# ── TypeScript / JavaScript ────────────────────────────────────────────────────
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Coverage (optional – wire in later with pytest-cov + coverage.xml) ────────
# sonar.python.coverage.reportPaths=coverage.xml

# ── SCM ──────────────────────────────────────────────────────────────────────
sonar.scm.provider=git
