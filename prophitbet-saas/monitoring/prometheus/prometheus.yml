global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/data_validation.yml"
  - "alerts/sonarqube.yml"
  - "alerts/system_checker.yml"

scrape_configs:
  - job_name: 'system-checker'
    static_configs:
      - targets: ['system-checker:9110']
  - job_name: 'sonarqube'
    metrics_path: '/api/monitoring/metrics'
    scrape_interval: 30s
    authorization:
      credentials_file: /etc/prometheus/sonarqube-passcode
    static_configs:
      - targets: ['sonarqube:9000']
  - job_name: 'scraper-log-pipeline'
    static_configs:
      - targets: ['loki:3100', 'alloy:12345']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'prophitbet-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'flower'
    static_configs:
      - targets: ['flower:5555']

  - job_name: 'prophitbet-domain'
    static_configs:
      - targets: ['domain-exporter:9108']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
